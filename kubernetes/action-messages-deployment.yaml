apiVersion: apps/v1
kind: Deployment

metadata:
  name: action-messages
  namespace: techpathway

spec:
  replicas: 2

  selector:
    matchLabels:
      app: action-messages

  template:
    metadata:
      labels:
        app: action-messages

    spec:
      containers:
        - name: action-messages
          image: 975503882726.dkr.ecr.us-east-1.amazonaws.com/action-messages:v1.0.1
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 5001

          readinessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3

          envFrom:
            - configMapRef:
                name: techpathway-config
            - secretRef:
                name: techpathway-secrets

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
