apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: action-messages-hpa
  namespace: techpathway

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: action-messages

  minReplicas: 2
  maxReplicas: 6

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
